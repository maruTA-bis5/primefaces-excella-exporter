<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:comp="http://xmlns.jcp.org/jsf/composite/components"
      lang="en">
    <h:head>
        <title>Password export modes</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <p:commandLink id="exportPage" ajax="false" value="Export page">
                <p:dataExporter type="excella" target="tbl" fileName="tree-password-page"
                    pageOnly="true" options="#{ttBasicView.passwordOptions}" />
            </p:commandLink>
            <p:commandLink id="exportSelection" ajax="false" value="Export selection">
                <p:dataExporter type="excella" target="tbl" fileName="tree-password-selection"
                    selectionOnly="true" options="#{ttBasicView.passwordOptions}" />
            </p:commandLink>
            <p:commandLink id="exportGroupedFacets" ajax="false" value="Export grouped facets">
                <p:dataExporter type="excella" target="groupedTbl" fileName="tree-password-grouped-facets"
                    options="#{ttBasicView.passwordOptions}" />
            </p:commandLink>
            <p:treeTable id="tbl" var="row" value="#{ttBasicView.passwordRoot}"
                paginator="true" rows="2" selectionMode="checkbox" selection="#{ttBasicView.selection}">
                <p:column headerText="String" footerText="String">
                    <h:outputText value="#{row.stringProperty}" />
                </p:column>
                <p:column headerText="Password" footerText="Password">
                    <p:password value="#{row.stringProperty}" disabled="true" />
                </p:column>
                <p:column field="stringProperty" headerText="Wrapped Password" footerText="Wrapped Password">
                    <h:panelGroup>
                        <p:password value="#{row.stringProperty}" disabled="true" />
                    </h:panelGroup>
                    <h:outputText value="sibling" />
                </p:column>
                <p:column field="stringProperty" headerText="Composite Password" footerText="Composite Password">
                    <comp:compositePassword value="#{row.stringProperty}" showPassword="true" />
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
                <p:column field="stringProperty" headerText="Hidden Composite Password" footerText="Hidden Composite Password">
                    <comp:compositePassword value="#{row.stringProperty}" showPassword="false" />
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
                <p:column field="stringProperty" headerText="Repeated Password" footerText="Repeated Password">
                    <ui:repeat value="#{[false,true]}" var="showPassword">
                        <p:password value="#{row.stringProperty}" rendered="#{showPassword}" disabled="true" />
                    </ui:repeat>
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
                <p:column field="stringProperty" headerText="Hidden Repeated Password" footerText="Hidden Repeated Password">
                    <ui:repeat value="#{[false,false]}" var="showPassword">
                        <p:password value="#{row.stringProperty}" rendered="#{showPassword}" disabled="true" />
                    </ui:repeat>
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
                <p:column>
                    <f:facet name="header">
                        <p:password value="header-secret" disabled="true" />
                    </f:facet>
                    <h:outputText value="#{row.stringProperty}" />
                    <f:facet name="footer">
                        <p:password value="footer-secret" disabled="true" />
                    </f:facet>
                </p:column>
                <p:column>
                    <f:facet name="header">
                        <h:commandLink>
                            <p:password value="command-link-header-secret" disabled="true" />
                        </h:commandLink>
                    </f:facet>
                    <h:outputText value="#{row.stringProperty}" />
                    <f:facet name="footer">
                        <h:commandLink>
                            <p:password value="command-link-footer-secret" disabled="true" />
                        </h:commandLink>
                    </f:facet>
                </p:column>
                <p:column headerText="BigDecimal link value" footerText="BigDecimal link value">
                    <p:link outcome="basic.xhtml" value="#{row.bigDecimalDecimalProperty}" />
                </p:column>
                <p:column field="stringProperty" headerText="Public Link Label" footerText="Public Link Label">
                    <p:link outcome="basic.xhtml" value="Public link label">
                        <p:password value="#{row.stringProperty}" disabled="true" />
                    </p:link>
                </p:column>
                <p:column field="stringProperty" headerText="Public Command Link Label" footerText="Public Command Link Label">
                    <h:commandLink value="Public command link label">
                        <p:password value="#{row.stringProperty}" disabled="true" />
                    </h:commandLink>
                </p:column>
            </p:treeTable>
            <p:treeTable id="groupedTbl" var="row" value="#{ttBasicView.passwordRoot}">
                <p:columnGroup type="header">
                    <p:row>
                        <p:column>
                            <f:facet name="header">
                                <p:password value="grouped-header-secret" disabled="true" />
                            </f:facet>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:commandLink>
                                    <p:password value="grouped-command-link-header-secret" disabled="true" />
                                </h:commandLink>
                            </f:facet>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <p:link outcome="basic.xhtml">
                                    <h:outputText value="#{204.89}">
                                        <f:convertNumber type="currency" currencySymbol="$" />
                                    </h:outputText>
                                </p:link>
                            </f:facet>
                        </p:column>
                    </p:row>
                </p:columnGroup>
                <p:column>
                    <h:outputText value="#{row.stringProperty}" />
                </p:column>
                <p:column>
                    <h:outputText value="#{row.stringProperty}" />
                </p:column>
                <p:column>
                    <h:outputText value="#{row.stringProperty}" />
                </p:column>
                <p:columnGroup type="footer">
                    <p:row>
                        <p:column>
                            <f:facet name="footer">
                                <p:password value="grouped-footer-secret" disabled="true" />
                            </f:facet>
                        </p:column>
                        <p:column>
                            <f:facet name="footer">
                                <h:commandLink>
                                    <p:password value="grouped-command-link-footer-secret" disabled="true" />
                                </h:commandLink>
                            </f:facet>
                        </p:column>
                        <p:column>
                            <f:facet name="footer">
                                <h:commandLink>
                                    <h:outputText value="#{204.89}">
                                        <f:convertNumber type="currency" currencySymbol="$" />
                                    </h:outputText>
                                </h:commandLink>
                            </f:facet>
                        </p:column>
                    </p:row>
                </p:columnGroup>
            </p:treeTable>
        </h:form>
    </h:body>
</html>
