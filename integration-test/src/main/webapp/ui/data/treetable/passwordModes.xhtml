<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:comp="http://xmlns.jcp.org/jsf/composite/components"
      lang="en">
    <h:head>
        <title>Password export modes</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <p:commandLink id="exportPage" ajax="false" value="Export page">
                <p:dataExporter type="excella" target="tbl" fileName="tree-password-page"
                    pageOnly="true" options="#{ttBasicView.passwordOptions}" />
            </p:commandLink>
            <p:commandLink id="exportSelection" ajax="false" value="Export selection">
                <p:dataExporter type="excella" target="tbl" fileName="tree-password-selection"
                    selectionOnly="true" options="#{ttBasicView.passwordOptions}" />
            </p:commandLink>
            <p:treeTable id="tbl" var="row" value="#{ttBasicView.passwordRoot}"
                paginator="true" rows="2" selectionMode="checkbox" selection="#{ttBasicView.selection}">
                <p:column headerText="String" footerText="String">
                    <h:outputText value="#{row.stringProperty}" />
                </p:column>
                <p:column headerText="Password" footerText="Password">
                    <p:password value="#{row.stringProperty}" disabled="true" />
                </p:column>
                <p:column field="stringProperty" headerText="Wrapped Password" footerText="Wrapped Password">
                    <h:panelGroup>
                        <p:password value="#{row.stringProperty}" disabled="true" />
                    </h:panelGroup>
                    <h:outputText value="sibling" />
                </p:column>
                <p:column field="stringProperty" headerText="Composite Password" footerText="Composite Password">
                    <comp:compositePassword value="#{row.stringProperty}" showPassword="true" />
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
                <p:column field="stringProperty" headerText="Hidden Composite Password" footerText="Hidden Composite Password">
                    <comp:compositePassword value="#{row.stringProperty}" showPassword="false" />
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
            </p:treeTable>
        </h:form>
    </h:body>
</html>
