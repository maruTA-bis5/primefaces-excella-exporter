<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:comp="http://xmlns.jcp.org/jsf/composite/components"
      lang="en">

    <h:head>
        <title>Password export</title>
    </h:head>

    <h:body>
        <h:form id="form">
            <p:commandLink id="allDefault" ajax="false">
                <h:outputText value="All Default" />
                <p:dataExporter type="excella" target="tbl" fileName="password-treetable-all-default" />
            </p:commandLink>
            <p:commandLink id="allMasked" ajax="false">
                <h:outputText value="All Masked" />
                <p:dataExporter type="excella" target="tbl" fileName="password-treetable-all-masked"
                    options="#{passwordExportView.maskedOptions}" />
            </p:commandLink>
            <p:commandLink id="allCustom" ajax="false">
                <h:outputText value="All Custom" />
                <p:dataExporter type="excella" target="tbl" fileName="password-treetable-all-custom"
                    options="#{passwordExportView.customReplacementOptions}" />
            </p:commandLink>

            <p:commandLink id="pageDefault" ajax="false">
                <h:outputText value="Page Default" />
                <p:dataExporter type="excella" target="tbl" fileName="password-treetable-page-default" pageOnly="true" />
            </p:commandLink>
            <p:commandLink id="pageMasked" ajax="false">
                <h:outputText value="Page Masked" />
                <p:dataExporter type="excella" target="tbl" fileName="password-treetable-page-masked" pageOnly="true"
                    options="#{passwordExportView.maskedOptions}" />
            </p:commandLink>
            <p:commandLink id="pageCustom" ajax="false">
                <h:outputText value="Page Custom" />
                <p:dataExporter type="excella" target="tbl" fileName="password-treetable-page-custom" pageOnly="true"
                    options="#{passwordExportView.customReplacementOptions}" />
            </p:commandLink>

            <p:commandLink id="selectionDefault" ajax="false">
                <h:outputText value="Selection Default" />
                <p:dataExporter type="excella" target="tbl" fileName="password-treetable-selection-default" selectionOnly="true" />
            </p:commandLink>
            <p:commandLink id="selectionMasked" ajax="false">
                <h:outputText value="Selection Masked" />
                <p:dataExporter type="excella" target="tbl" fileName="password-treetable-selection-masked" selectionOnly="true"
                    options="#{passwordExportView.maskedOptions}" />
            </p:commandLink>
            <p:commandLink id="selectionCustom" ajax="false">
                <h:outputText value="Selection Custom" />
                <p:dataExporter type="excella" target="tbl" fileName="password-treetable-selection-custom" selectionOnly="true"
                    options="#{passwordExportView.customReplacementOptions}" />
            </p:commandLink>

            <p:treeTable id="tbl" var="row" value="#{passwordExportView.treeRoot}" paginator="true" rows="1"
                         selection="#{passwordExportView.treeSelection}" selectionMode="checkbox">
                <p:column field="password">
                    <f:facet name="header">
                        <p:password value="header-password" />
                    </f:facet>
                    <p:password value="#{row.password}" />
                    <f:facet name="footer">
                        <p:password value="footer-password" />
                    </f:facet>
                </p:column>
                <p:column headerText="Ordinary header" footerText="Ordinary footer">
                    <h:outputText value="#{row.text}" />
                </p:column>
                <p:column headerText="Multiple components">
                    <h:outputText value="#{row.text}" />
                    <p:password value="#{row.password}" />
                </p:column>
                <p:column headerText="Panel password">
                    <h:panelGroup>
                        <p:password value="#{row.password}" />
                    </h:panelGroup>
                </p:column>
                <p:column headerText="Link password">
                    <p:link href="#">
                        <p:password value="#{row.password}" />
                    </p:link>
                </p:column>
                <p:column headerText="Cell editor password">
                    <p:cellEditor>
                        <f:facet name="output">
                            <p:password value="#{row.password}" />
                        </f:facet>
                        <f:facet name="input">
                            <p:password value="#{row.password}" />
                        </f:facet>
                    </p:cellEditor>
                </p:column>
                <p:column headerText="Composite password">
                    <comp:passwordOutput value="#{row.password}" />
                    <comp:passwordOutput value="#{row.password}" passwordRendered="false" />
                </p:column>
                <p:column headerText="Panel with ordinary text">
                    <h:panelGroup>
                        <h:outputText value="#{row.text}" />
                        <p:password value="#{row.password}" />
                    </h:panelGroup>
                </p:column>
                <p:column headerText="Unrendered password">
                    <p:password value="#{row.password}" rendered="false" />
                </p:column>
                <p:column headerText="Unrendered nested password">
                    <h:panelGroup>
                        <p:password value="#{row.password}" rendered="false" />
                    </h:panelGroup>
                </p:column>
                <p:column field="password" headerText="Unrendered field password">
                    <p:password value="#{row.password}" rendered="false" />
                </p:column>
                <p:column field="password" headerText="Unrendered composite field password">
                    <comp:passwordOutput value="#{row.password}" passwordRendered="false" />
                </p:column>
                <p:column headerText="Explicit export value" exportValue="export-value">
                    <p:password value="#{row.password}" />
                </p:column>
                <p:column headerText="Export function" exportFunction="#{passwordExportView.passwordExportFunction}">
                    <p:password value="#{row.password}" />
                </p:column>
                <p:column>
                    <f:facet name="header">
                        <h:panelGroup>
                            <h:outputText value="wrapped-header" />
                            <p:password value="nested-header-password" />
                        </h:panelGroup>
                    </f:facet>
                    <h:outputText value="#{row.text}" />
                    <f:facet name="footer">
                        <h:panelGroup>
                            <h:outputText value="wrapped-footer" />
                            <p:password value="nested-footer-password" />
                        </h:panelGroup>
                    </f:facet>
                </p:column>
            </p:treeTable>
        </h:form>
    </h:body>
</html>
