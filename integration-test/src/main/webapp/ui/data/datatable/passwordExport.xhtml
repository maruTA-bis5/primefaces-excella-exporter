<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:comp="http://xmlns.jcp.org/jsf/composite/components"
      lang="en">

    <h:head>
        <title>Password export</title>
    </h:head>

    <h:body>
        <h:form id="form">
            <p:commandLink id="allDefault" ajax="false">
                <h:outputText value="All Default" />
                <p:dataExporter type="excella" target="tbl" fileName="password-datatable-all-default" />
            </p:commandLink>
            <p:commandLink id="allMasked" ajax="false">
                <h:outputText value="All Masked" />
                <p:dataExporter type="excella" target="tbl" fileName="password-datatable-all-masked"
                    options="#{passwordExportView.maskedOptions}" />
            </p:commandLink>
            <p:commandLink id="allCustom" ajax="false">
                <h:outputText value="All Custom" />
                <p:dataExporter type="excella" target="tbl" fileName="password-datatable-all-custom"
                    options="#{passwordExportView.customReplacementOptions}" />
            </p:commandLink>

            <p:commandLink id="pageDefault" ajax="false">
                <h:outputText value="Page Default" />
                <p:dataExporter type="excella" target="tbl" fileName="password-datatable-page-default" pageOnly="true" />
            </p:commandLink>
            <p:commandLink id="pageMasked" ajax="false">
                <h:outputText value="Page Masked" />
                <p:dataExporter type="excella" target="tbl" fileName="password-datatable-page-masked" pageOnly="true"
                    options="#{passwordExportView.maskedOptions}" />
            </p:commandLink>
            <p:commandLink id="pageCustom" ajax="false">
                <h:outputText value="Page Custom" />
                <p:dataExporter type="excella" target="tbl" fileName="password-datatable-page-custom" pageOnly="true"
                    options="#{passwordExportView.customReplacementOptions}" />
            </p:commandLink>

            <p:commandLink id="selectionDefault" ajax="false">
                <h:outputText value="Selection Default" />
                <p:dataExporter type="excella" target="tbl" fileName="password-datatable-selection-default" selectionOnly="true" />
            </p:commandLink>
            <p:commandLink id="selectionMasked" ajax="false">
                <h:outputText value="Selection Masked" />
                <p:dataExporter type="excella" target="tbl" fileName="password-datatable-selection-masked" selectionOnly="true"
                    options="#{passwordExportView.maskedOptions}" />
            </p:commandLink>
            <p:commandLink id="selectionCustom" ajax="false">
                <h:outputText value="Selection Custom" />
                <p:dataExporter type="excella" target="tbl" fileName="password-datatable-selection-custom" selectionOnly="true"
                    options="#{passwordExportView.customReplacementOptions}" />
            </p:commandLink>

            <p:dataTable id="tbl" var="row" value="#{passwordExportView.dataRows}"
                         selection="#{passwordExportView.dataSelection}" selectionMode="single"
                         rowKey="#{row.id}" paginator="true" rows="1">
                <p:column>
                    <f:facet name="header">
                        <p:password value="#{passwordExportView.headerPassword}" disabled="true" />
                    </f:facet>
                    <p:password value="#{row.password}" disabled="true" />
                    <f:facet name="footer">
                        <p:password value="#{passwordExportView.footerPassword}" disabled="true" />
                    </f:facet>
                </p:column>
                <p:column field="password" headerText="Field password">
                    <p:password value="#{row.password}" disabled="true" />
                </p:column>
                <p:column headerText="Ordinary header" footerText="Ordinary footer">
                    <h:outputText value="#{row.text}" />
                </p:column>
                <p:column headerText="Multiple components">
                    <h:outputText value="#{row.text}" />
                    <p:password value="#{row.password}" disabled="true" />
                </p:column>
                <p:column headerText="Panel password">
                    <h:panelGroup>
                        <p:password value="#{row.password}" disabled="true" />
                    </h:panelGroup>
                </p:column>
                <p:column headerText="Link password">
                    <p:link href="#">
                        <p:password value="#{row.password}" disabled="true" />
                    </p:link>
                </p:column>
                <p:column headerText="Cell editor password">
                    <p:cellEditor>
                        <f:facet name="output">
                            <p:password value="#{row.password}" disabled="true" />
                        </f:facet>
                        <f:facet name="input">
                            <p:password value="#{row.password}" disabled="true" />
                        </f:facet>
                    </p:cellEditor>
                </p:column>
                <p:column headerText="Composite password">
                    <comp:passwordOutput value="#{row.password}" />
                    <comp:passwordOutput value="#{row.password}" passwordRendered="false" />
                </p:column>
                <p:column headerText="Panel with ordinary text">
                    <h:panelGroup>
                        <h:outputText value="#{row.text}" />
                        <p:password value="#{row.password}" disabled="true" />
                    </h:panelGroup>
                </p:column>
                <p:column headerText="Unrendered password">
                    <p:password value="#{row.password}" rendered="false" disabled="true" />
                </p:column>
                <p:column headerText="Unrendered nested password">
                    <h:panelGroup>
                        <p:password value="#{row.password}" rendered="false" disabled="true" />
                    </h:panelGroup>
                </p:column>
                <p:column field="password" headerText="Unrendered field password">
                    <p:password value="#{row.password}" rendered="false" disabled="true" />
                </p:column>
                <p:column field="password" headerText="Unrendered composite field password">
                    <comp:passwordOutput value="#{row.password}" passwordRendered="false" />
                </p:column>
                <p:column headerText="Explicit export value" exportValue="export-value">
                    <p:password value="#{row.password}" disabled="true" />
                </p:column>
                <p:column headerText="Export function" exportFunction="#{passwordExportView.passwordExportFunction}">
                    <p:password value="#{row.password}" disabled="true" />
                </p:column>
                <p:column>
                    <f:facet name="header">
                        <h:panelGroup>
                            <h:outputText value="wrapped-header" />
                            <p:password value="#{passwordExportView.nestedHeaderPassword}" disabled="true" />
                        </h:panelGroup>
                    </f:facet>
                    <h:outputText value="#{row.text}" />
                    <f:facet name="footer">
                        <h:panelGroup>
                            <h:outputText value="wrapped-footer" />
                            <p:password value="#{passwordExportView.nestedFooterPassword}" disabled="true" />
                        </h:panelGroup>
                    </f:facet>
                </p:column>
                <p:column headerText="Nested ordinary text and password">
                    <h:panelGroup>
                        <h:panelGroup>
                            <h:outputText value="#{row.text}" />
                        </h:panelGroup>
                        <p:password value="#{row.password}" disabled="true" />
                    </h:panelGroup>
                </p:column>
            </p:dataTable>
        </h:form>
    </h:body>
</html>
