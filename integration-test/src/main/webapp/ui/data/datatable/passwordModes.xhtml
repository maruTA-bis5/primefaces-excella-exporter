<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:comp="http://xmlns.jcp.org/jsf/composite/components"
      lang="en">
    <h:head>
        <title>Password export modes</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <p:commandLink id="exportPage" ajax="false" value="Export page">
                <p:dataExporter type="excella" target="tbl" fileName="password-page"
                    pageOnly="true" options="#{dtBasicView.passwordOptions}" />
            </p:commandLink>
            <p:commandLink id="exportSelection" ajax="false" value="Export selection">
                <p:dataExporter type="excella" target="tbl" fileName="password-selection"
                    selectionOnly="true" options="#{dtBasicView.passwordOptions}" />
            </p:commandLink>
            <p:dataTable id="tbl" var="row" value="#{dtBasicView.passwordRows}"
                paginator="true" rows="2" rowKey="#{row.stringProperty}"
                selectionMode="multiple" selection="#{dtBasicView.selection}">
                <p:columnGroup type="header">
                    <p:row>
                        <p:column>
                            <f:facet name="header">
                                <h:commandLink>
                                    <p:password value="header-secret" disabled="true" />
                                </h:commandLink>
                            </f:facet>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <p:password value="header-secret" disabled="true" />
                            </f:facet>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:commandLink value="Wrapped Password" />
                            </f:facet>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <p:link value="#{dtBasicView.passwordRows[0].bigDecimalDecimalProperty}">
                                    <f:convertNumber type="currency" currencySymbol="$" />
                                </p:link>
                            </f:facet>
                        </p:column>
                        <p:column headerText="Composite Password" />
                        <p:column headerText="Hidden Composite Password" />
                        <p:column headerText="Repeated Password" />
                        <p:column headerText="Hidden Repeated Password" />
                        <p:column headerText="Cell editor" />
                        <p:column headerText="Public Link Label" />
                        <p:column headerText="Public Command Link Label" />
                        <p:column headerText="Masked Link With Sibling" />
                    </p:row>
                </p:columnGroup>
                <p:columnGroup type="footer">
                    <p:row>
                        <p:column>
                            <f:facet name="footer">
                                <p:password value="footer-secret" disabled="true" />
                            </f:facet>
                        </p:column>
                        <p:column>
                            <f:facet name="footer">
                                <h:commandLink>
                                    <p:password value="footer-secret" disabled="true" />
                                </h:commandLink>
                            </f:facet>
                        </p:column>
                        <p:column footerText="Wrapped Password" />
                        <p:column>
                            <f:facet name="footer">
                                <h:commandLink>
                                    <h:outputText value="#{dtBasicView.passwordRows[0].bigDecimalDecimalProperty}">
                                        <f:convertNumber type="currency" currencySymbol="$" />
                                    </h:outputText>
                                </h:commandLink>
                            </f:facet>
                        </p:column>
                        <p:column footerText="Composite Password" />
                        <p:column footerText="Hidden Composite Password" />
                        <p:column footerText="Repeated Password" />
                        <p:column footerText="Hidden Repeated Password" />
                        <p:column footerText="Cell editor" />
                        <p:column footerText="Public Link Label" />
                        <p:column footerText="Public Command Link Label" />
                        <p:column footerText="Masked Link With Sibling" />
                    </p:row>
                </p:columnGroup>
                <p:column headerText="String" footerText="String">
                    <h:outputText value="#{row.stringProperty}" />
                </p:column>
                <p:column headerText="Password" footerText="Password">
                    <p:password value="#{row.stringProperty}" disabled="true" />
                </p:column>
                <p:column field="stringProperty" headerText="Wrapped Password" footerText="Wrapped Password">
                    <h:panelGroup>
                        <p:password value="#{row.stringProperty}" disabled="true" />
                    </h:panelGroup>
                    <h:outputText value="sibling" />
                </p:column>
                <p:column headerText="Link value" footerText="Link value">
                    <p:link value="#{row.bigDecimalDecimalProperty}" />
                </p:column>
                <p:column field="stringProperty" headerText="Composite Password" footerText="Composite Password">
                    <comp:compositePassword value="#{row.stringProperty}" showPassword="true" />
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
                <p:column field="stringProperty" headerText="Hidden Composite Password" footerText="Hidden Composite Password">
                    <comp:compositePassword value="#{row.stringProperty}" showPassword="false" />
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
                <p:column field="stringProperty" headerText="Repeated Password" footerText="Repeated Password">
                    <ui:repeat value="#{[false,true]}" var="showPassword">
                        <p:password value="#{row.stringProperty}" rendered="#{showPassword}" disabled="true" />
                    </ui:repeat>
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
                <p:column field="stringProperty" headerText="Hidden Repeated Password" footerText="Hidden Repeated Password">
                    <ui:repeat value="#{[false,false]}" var="showPassword">
                        <p:password value="#{row.stringProperty}" rendered="#{showPassword}" disabled="true" />
                    </ui:repeat>
                    <h:outputText value="sibling 1" />
                    <h:outputText value="sibling 2" />
                </p:column>
                <p:column field="stringProperty" headerText="Cell editor" footerText="Cell editor">
                    <p:cellEditor>
                        <f:facet name="output">
                            <h:outputText value="#{row.stringProperty}" />
                        </f:facet>
                        <f:facet name="input">
                            <p:password value="#{row.stringProperty}" />
                        </f:facet>
                    </p:cellEditor>
                </p:column>
                <p:column field="stringProperty" headerText="Public Link Label" footerText="Public Link Label">
                    <p:link value="Public link label">
                        <p:password value="#{row.stringProperty}" disabled="true" />
                    </p:link>
                </p:column>
                <p:column field="stringProperty" headerText="Public Command Link Label" footerText="Public Command Link Label">
                    <h:commandLink value="Public command link label">
                        <p:password value="#{row.stringProperty}" disabled="true" />
                    </h:commandLink>
                </p:column>
                <p:column field="stringProperty" headerText="Masked Link With Sibling" footerText="Masked Link With Sibling">
                    <p:link value="Public link label with sibling">
                        <p:password value="#{row.stringProperty}" disabled="true" />
                    </p:link>
                    <h:outputText value="sibling" />
                </p:column>
            </p:dataTable>
        </h:form>
    </h:body>
</html>
