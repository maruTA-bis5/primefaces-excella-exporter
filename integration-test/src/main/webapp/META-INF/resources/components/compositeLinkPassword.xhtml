<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:composite="http://xmlns.jcp.org/jsf/composite"
      lang="en">
    <head><title>Composite Link Password fixture</title></head>
    <composite:interface>
        <composite:attribute name="value" />
        <composite:attribute name="linkRendered" type="java.lang.Boolean" />
        <composite:attribute name="passwordRendered" type="java.lang.Boolean" />
    </composite:interface>
    <composite:implementation>
        <p:link value="Composite link label" rendered="#{cc.attrs.linkRendered}">
            <p:password value="#{cc.attrs.value}" disabled="true" />
        </p:link>
        <h:panelGroup>
            <p:password value="#{cc.attrs.value}" rendered="#{cc.attrs.passwordRendered}" disabled="true" />
        </h:panelGroup>
    </composite:implementation>
</html>
