<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui"
  xmlns:composite="http://xmlns.jcp.org/jsf/composite"
  lang="en">

  <head><title>Composite hidden link password fixture</title></head>
  <composite:interface>
    <composite:attribute name="value" />
    <composite:attribute name="showLink" type="java.lang.Boolean" />
  </composite:interface>

  <composite:implementation>
    <p:link outcome="basic.xhtml" value="Hidden link label" rendered="#{cc.attrs.showLink}" />
    <h:panelGroup>
      <p:password value="#{cc.attrs.value}" disabled="true" />
    </h:panelGroup>
  </composite:implementation>
</html>
