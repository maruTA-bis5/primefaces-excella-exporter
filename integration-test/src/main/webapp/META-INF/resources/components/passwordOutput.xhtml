<ui:component xmlns="http://www.w3.org/1999/xhtml"
  xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:cc="http://xmlns.jcp.org/jsf/composite"
  xmlns:p="http://primefaces.org/ui">

  <cc:interface>
    <cc:attribute name="value" />
    <cc:attribute name="passwordRendered" type="boolean" default="true" />
    <cc:valueHolder name="password" />
  </cc:interface>

  <cc:implementation>
    <p:password id="password" value="#{cc.attrs.value}" rendered="#{cc.attrs.passwordRendered}" disabled="true" />
  </cc:implementation>
</ui:component>
